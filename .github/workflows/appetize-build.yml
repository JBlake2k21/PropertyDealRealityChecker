name: Build iOS Simulator .app and upload to Appetize

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      SIMULATOR_NAME: "iPhone 17"
      DERIVED_DATA: "${{ github.workspace }}/build/DerivedData"
      PROJECT_NAME: RealityCheckerWrapper
      TARGET_NAME: RealityCheckerWrapperApp
      DEPLOYMENT_TARGET: "18.0"
      APPETIZE_API_URL: "https://api.appetize.io/v1/apps/upload"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Homebrew and xcodegen available
        run: |
          echo "Installing xcodegen (if not installed)..."
          if ! command -v xcodegen >/dev/null; then
            brew update
            brew install xcodegen
          else
            echo "xcodegen already present: $(xcodegen version)"
          fi

      - name: Create temporary project.yml + Info.plist
        run: |
          # Create a dummy Swift file for xcodegen to use as a source
          mkdir -p AppWrapper
          cat > AppWrapper/Dummy.swift <<'SWIFT'
          import Foundation
          import RealityCheckerApp
          // Dummy file to ensure xcodegen compiles this module and links the RealityCheckerApp library
          SWIFT

          # Create project.yml that makes an iOS app target using the SPM library
          cat > project.yml <<'YML'
          name: RealityCheckerWrapper
          options:
            bundleIdPrefix: com.example
          configs:
            Debug: debug
            Release: release
          packages:
            RealityCheckerPackage:
              path: .
          targets:
            RealityCheckerWrapperApp:
              type: application
              platform: iOS
              deploymentTarget: "18.0"
              sources: 
                - path: AppWrapper
              dependencies:
                - package: RealityCheckerPackage
                  product: RealityCheckerApp
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.example.RealityCheckerApp
                INFOPLIST_FILE: Info.plist
                OTHER_LDFLAGS: -all_load
          YML

          # Minimal Info.plist placed next to the target sources
          cat > Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>com.example.$(PRODUCT_NAME:rfc1034identifier)</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>UILaunchStoryboardName</key><string></string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Run xcodegen to generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "Generated project: RealityCheckerWrapper.xcodeproj"

      - name: Build for iOS Simulator (Release)
        id: build
        run: |
          set -euo pipefail
          echo "Cleaning and building via xcodebuild..."
          xcodebuild -project "RealityCheckerWrapper.xcodeproj" \
            -scheme "RealityCheckerWrapperApp" \
            -configuration Release \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA}" \
            clean build CODE_SIGNING_ALLOWED=NO

          echo "xcodebuild exit status: $?"

          # Try to find the built .app path
          APP_PATH=$(find "${DERIVED_DATA}" -name "RealityCheckerWrapperApp.app" -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find RealityCheckerWrapperApp.app in DerivedData."
            find "${DERIVED_DATA}" -print -maxdepth 10 || true
            exit 2
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Zip the .app bundle
        id: zip
        if: always()
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          ZIP_NAME="RealityCheckerApp.app.zip"
          ZIP_FULL="${GITHUB_WORKSPACE}/${ZIP_NAME}"

          echo "Zipping $APP_PATH -> $ZIP_FULL"

          # Validate APP_PATH exists and is readable
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: APP_PATH is empty or not a directory: '$APP_PATH'"
            echo "Listing DerivedData directory to help debug:"
            ls -la "${DERIVED_DATA}" || true
            # Preserve failure in this step so we don't attempt to upload a missing zip
            exit 1
          fi

          cd "$(dirname "$APP_PATH")"
          # Create zip at a known absolute path
          zip -r -y "$ZIP_FULL" "$(basename "$APP_PATH")"

          if [ ! -f "$ZIP_FULL" ]; then
            echo "ERROR: Failed to create zip at $ZIP_FULL"
            ls -la "$(dirname "$ZIP_FULL")" || true
            exit 1
          fi

          echo "Created zip at $ZIP_FULL"
          # Expose zip path for later steps
          echo "zip_path=$ZIP_FULL" >> $GITHUB_OUTPUT
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Pre-upload debug (show ZIP and workspace)
        if: always()
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          echo "Workspace listing (top-level):"
          ls -la || true
          ZIP="${{ steps.zip.outputs.zip_path }}"
          echo "ZIP path to upload: $ZIP"
          if [ -f "$ZIP" ]; then
            echo "ZIP exists:" 
            ls -la "$ZIP"
            echo "Head of file (first 64 bytes) for readability check:"
            head -c 64 "$ZIP" | hexdump -C || true
          else
            echo "ERROR: ZIP not found at $ZIP"
            exit 1
          fi
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload ZIP to Appetize.io (curl with proxy flags)
        if: always()
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.zip_path }}"

          CURL_OPTS=( --fail --show-error --location )
          # Retry on transient network errors
          CURL_OPTS+=( --retry 5 --retry-delay 10 --retry-connrefused --max-time 600 )

          # Force insecure if corporate MITM proxy blocks Appetize certs
          CURL_OPTS+=( --insecure )

          echo "Uploading $ZIP to Appetize.io ..."
          # Use verbose output for CI logs to help diagnose issues; remove --silent
          curl "${CURL_OPTS[@]}" \
            -F "token=${APPETIZE_TOKEN}" \
            -F "file=@${ZIP}" \
            "${APPETIZE_API_URL}"
