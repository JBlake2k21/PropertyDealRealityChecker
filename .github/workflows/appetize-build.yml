name: Appetize.io iOS Simulator Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Build for iOS Simulator
        run: |
          # Build the workspace for the iOS Simulator using the RealityCheckerApp scheme
          xcodebuild \
            -scheme RealityCheckerApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath build \
            clean build

      - name: Zip the Application Bundle
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          # The resulting .app must be zipped before uploading to Appetize
          zip -r RealityCheckerApp.zip RealityCheckerApp.app
          
      - name: Upload to Appetize.io
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          
          # Upload the zip to Appetize using their API
          curl --http1.1 -F "file=@RealityCheckerApp.zip" \
               -F "platform=ios" \
               -F "fileType=zip" \
               -F "note=Reality Checker Build via GitHub Actions" \
               -H "Authorization: Bearer $APPETIZE_API_TOKEN" \
               https://api.appetize.io/v1/apps
               
          echo ""
          echo "Upload complete! Check your Appetize.io dashboard for the preview link."
